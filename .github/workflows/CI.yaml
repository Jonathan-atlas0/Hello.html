
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Executar build
        run: echo "Build executado com sucesso!"
ping-test:
    name: Ping Test
    runs-on: ubuntu-latest

    steps:
      - name: Executar ping test
        run: |
          ping -c 5 8.8.8.8 && echo "Ping test executado com sucesso!" || echo "Ping test falhou!"       

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Executar testes
        run: echo "Testes executados com sucesso!"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Realizar deploy
        run: echo "Deploy executado com sucesso!"
